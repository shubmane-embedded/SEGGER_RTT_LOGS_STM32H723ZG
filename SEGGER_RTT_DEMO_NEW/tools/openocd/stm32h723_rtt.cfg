# =============================================================================
#  OpenOCD configuration: ST-LINK (V2 / V2-1 / V3) + STM32H723 + SEGGER RTT
#
#  RTT channel 0 is served as a raw TCP stream on localhost:19021
#  -> connect PuTTY (Raw), Tera Term (TCP/IP) or the CubeIDE Terminal (Telnet).
#
#  Use 1 - standalone (board already flashed and running):
#      openocd -c "set RTT_STANDALONE 1" -f stm32h723_rtt.cfg -c "init" -c "rtt_wait_start"
#    (start_rtt_openocd.bat does exactly this)
#
#  Use 2 - inside STM32CubeIDE (Debug probe = ST-LINK (OpenOCD)):
#      Debugger tab -> Configuration Script -> "User Defined" -> this file.
#      Requires "<project> Debug.cfg" in the project root: CubeIDE creates it
#      when Configuration Script = "Automated Generation" (run Debug once).
#      RTT starts automatically the first time the debugger halts at main().
#
#  Works with the OpenOCD bundled in STM32CubeIDE, OpenOCD 0.11/0.12 and newer.
# =============================================================================

# ---- Settings you may change ------------------------------------------------
if { ![info exists RTT_PORT] }        { set RTT_PORT        19021 }
# Search window for the "SEGGER RTT" control block: whole DTCM.
if { ![info exists RTT_SEARCH_ADDR] } { set RTT_SEARCH_ADDR 0x20000000 }
if { ![info exists RTT_SEARCH_SIZE] } { set RTT_SEARCH_SIZE 0x20000 }

# ---- Debug probe + target -----------------------------------------------------
# Preferred: reuse the config STM32CubeIDE generated for this project
# ("<project> Debug.cfg" in the project root). It matches ST's own OpenOCD
# build exactly (ST-LINK DAP mode, chip name, reset/connect settings).
# Fallback (no generated file, e.g. plain upstream OpenOCD): generic setup.
set _RTT_HERE [file normalize [file dirname [info script]]]
set _RTT_GEN  ""
foreach _d [list "$_RTT_HERE/../.." "$_RTT_HERE/.." "$_RTT_HERE"] {
    set _f [lsort [glob -nocomplain -directory $_d -- "* Debug.cfg"]]
    if { [llength $_f] > 0 } { set _RTT_GEN [lindex $_f 0]; break }
}

if { $_RTT_GEN ne "" } {
    echo "RTT: using CubeIDE generated config: $_RTT_GEN"
    source $_RTT_GEN
} else {
    echo "RTT: no '<project> Debug.cfg' found - using generic ST-LINK setup"
    source [find interface/stlink-dap.cfg]
    transport select dapdirect_swd
    source [find target/stm32h7x.cfg]
}

set _RTT_TARGET [target current]

# Standalone use (start_rtt_openocd.bat sets RTT_STANDALONE=1): the generated
# config uses "connect_assert_srst" (connect under reset). Without a debugger
# that would leave the MCU held in reset after "init" - the firmware never
# runs and DTCM cannot be read ("Failed to read memory at 0x20000000").
# Attach to the running firmware instead; "reset run" still works via SRST.
if { [info exists RTT_STANDALONE] && $RTT_STANDALONE } {
    # connect_deassert_srst must be given explicitly: omitting it keeps the
    # previously configured connect_assert_srst.
    reset_config srst_only srst_nogate connect_deassert_srst
}

# OpenOCD's default flash-algorithm work area is DTCM 0x20000000 (no backup),
# which is exactly where the RTT buffers live. Move it to AXI SRAM so that
# flashing never overwrites the RTT control block while RTT is being polled.
$_RTT_TARGET configure -work-area-phys 0x24000000 -work-area-size 0x10000 -work-area-backup 0

# ---- RTT --------------------------------------------------------------------
rtt setup $RTT_SEARCH_ADDR $RTT_SEARCH_SIZE "SEGGER RTT"
rtt server start $RTT_PORT 0

set _RTT_STARTED 0

# Try once to find the control block and start polling. Quiet on failure.
proc rtt_try_start {} {
    global _RTT_STARTED RTT_PORT
    if { $_RTT_STARTED } { return 1 }
    if { [catch {rtt start}] } { return 0 }
    # "rtt start" returns OK even when it only logs "No control block found"
    # (e.g. at the reset halt, before SEGGER_RTT_Init() ran). "rtt channellist"
    # fails in that case, so use it to decide whether to retry later.
    if { [catch {rtt channellist}] } { return 0 }
    catch { rtt polling_interval 10 }
    set _RTT_STARTED 1
    echo "RTT: started - connect your terminal to localhost:$RTT_PORT"
    return 1
}

# Standalone use: retry for up to ~20 s (the firmware must have called
# SEGGER_RTT_Init(), which rtt_log.c does automatically before main()).
proc rtt_wait_start {} {
    for { set i 0 } { $i < 40 } { incr i } {
        if { [rtt_try_start] } { return }
        sleep 500
    }
    echo "RTT: control block NOT found in DTCM. Is the firmware running and"
    echo "     does the .map file show _SEGGER_RTT at 0x2000xxxx?"
}

# Debugger use: start RTT automatically whenever the core halts
# (e.g. at the breakpoint on main()). Failing attempts are ignored.
# Any existing "halted" handler from the target config is kept and runs first.
set _RTT_PREV_HALTED ""
catch { set _RTT_PREV_HALTED [$_RTT_TARGET cget -event halted] }
$_RTT_TARGET configure -event halted "$_RTT_PREV_HALTED\nrtt_try_start"